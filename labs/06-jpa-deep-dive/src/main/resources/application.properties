spring.application.name=jpa-deep-dive

# Never hold a DB connection for the whole HTTP request; lazy loading outside a service must fail loudly.
spring.jpa.open-in-view=false
# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate

# JDBC batching: group INSERT/UPDATE statements (needs SEQUENCE ids; IDENTITY ids cannot be batched).
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Lab only: the tests count SQL statements through Hibernate's Statistics API.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=warn

spring.datasource.hikari.maximum-pool-size=12
