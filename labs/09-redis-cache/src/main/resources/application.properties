spring.application.name=redis-cache
spring.threads.virtual.enabled=true

# Base TTL per cache (CatalogCacheProperties). Every cache used in an annotation must be listed.
app.cache.ttl.products=10m
app.cache.ttl.skus=1h
app.cache.ttl.skus-negative=30s
app.cache.ttl.quotes=5s
# Add up to 10% random extra TTL per entry, so a bulk warm-up doesn't expire all at once.
app.cache.jitter=0.1

app.rate-limit.limit=100
app.rate-limit.window=1m
