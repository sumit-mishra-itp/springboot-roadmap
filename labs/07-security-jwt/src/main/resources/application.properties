spring.application.name=security-jwt

# Self-issued tokens: this app is its own tiny authorization server, so it chooses issuer and audience.
app.security.issuer=http://localhost:8080
app.security.audience=documents-api
app.security.access-token-ttl=5m
app.security.refresh-token-ttl=7d
app.security.allowed-origins=http://localhost:5173

# RFC 9457 ProblemDetail for MVC exceptions (validation errors, 404s).
# Security errors get theirs from ProblemDetailSecurityHandler, because they never reach DispatcherServlet.
spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health,info
