spring.application.name=webflux

# R2DBC (spring.r2dbc.*) and Flyway's JDBC URL both come from @ServiceConnection: in tests, and in
# TestWebfluxApplication when you run `./mvnw spring-boot:test-run`. No credentials live here.

# Restore ThreadLocals (MDC) from the Reactor Context in every operator, not only in handle()/tap().
spring.reactor.context-propagation=auto
logging.pattern.level=%5p [rid=%X{requestId:-}]

# The slow downstream. By default the app calls its own simulated downstream route.
quotes.base-url=http://localhost:8080/downstream
quotes.timeout=500ms
quotes.max-retries=2
quotes.first-backoff=100ms
