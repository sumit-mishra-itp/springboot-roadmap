spring.application.name=aws-localstack

# Secrets Manager as a config source. The secret's JSON keys become properties, prefixed with "payment.".
# Not "optional:", so the app fails fast at startup if the secret is missing or unreadable.
spring.config.import=aws-secretsmanager:/lab/payment-api?prefix=payment.

# No credentials here, ever. On AWS they come from the default provider chain (ECS task role, EKS Pod Identity/IRSA, EC2 instance profile).
spring.cloud.aws.region.static=us-east-1

lab.bucket=lab-uploads
lab.orders-queue=orders
lab.order-events-topic=order-events
lab.billing-queue=billing
lab.shipping-queue=shipping
