# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=otel  (after docker compose up -d)

# Traces over OTLP/HTTP to the collector, which forwards them to Tempo
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces

# Structured JSON logs (Boot 3.4+): ecs | logstash | gelf. Every MDC entry, traceId and spanId included, becomes a JSON field.
logging.structured.format.console=ecs
logging.structured.ecs.service.environment=local
