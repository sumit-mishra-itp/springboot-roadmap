spring.application.name=observability
# RFC 9457 ProblemDetail for validation errors without a hand-written advice
spring.mvc.problemdetails.enabled=true

# --- Actuator exposure: only health is exposed over HTTP by default ---
# Lab only: in production, put actuator behind its own SecurityFilterChain and/or management.server.port.
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# --- Kubernetes probes (on by default in Boot 4). Readiness includes the external dependency; liveness never does ---
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,downstream
# Also serve /livez and /readyz on the main port, so probes still work if management.server.port is set
management.endpoint.health.probes.add-additional-paths=true

# --- /actuator/info ---
management.info.java.enabled=true
management.info.env.enabled=true
info.app.team=platform
info.app.oncall=platform-oncall

# --- Micrometer ---
# Enables @Observed, @Timed, @Counted, @MeterTag and @NewSpan aspects (needs aspectjweaver)
management.observations.annotations.enabled=true
management.metrics.tags.region=local
# The OTel starter brings micrometer-registry-otlp. Metrics go to Prometheus by scrape here, so do not push them too.
management.otlp.metrics.export.enabled=false

# --- Tracing: the default is 10%. 100% only for a lab or low-traffic service ---
management.tracing.sampling.probability=1.0

# --- Graceful shutdown (the default since Boot 3.4): readiness flips to REFUSING_TRAFFIC, in-flight requests finish ---
spring.lifecycle.timeout-per-shutdown-phase=20s
