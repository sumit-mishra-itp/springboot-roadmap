spring.application.name=kafka

# --- JPA / Flyway ---------------------------------------------------------------------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Validation errors come back as RFC 9457 ProblemDetail (Boot's ProblemDetailsExceptionHandler advice).
spring.mvc.problemdetails.enabled=true

# --- Producer -------------------------------------------------------------------------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
# Jackson 3 serializer (Spring Kafka 4). JsonSerializer is the deprecated Jackson 2 variant.
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
# Both are already the client defaults since Kafka 3.0. They are stated here so nobody "tunes" them away:
# acks=all waits for every in-sync replica, and idempotence stops retries from writing duplicates or reordering.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
# The __TypeId__ header carries a logical token instead of a Java class name, so the consumer's
# class can live in another package (or service) without breaking deserialization.
spring.kafka.producer.properties.spring.json.type.mapping=orderPlaced:dev.roadmap.kafka.order.OrderPlaced

# --- Consumer -------------------------------------------------------------------------------
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer turns a malformed payload into a DeserializationException that the
# error handler can dead-letter, instead of the container failing on the same record forever.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=orderPlaced:dev.roadmap.kafka.order.OrderPlaced

# --- Listener container ---------------------------------------------------------------------
# One consumer thread per partition (orders.placed has 3). Threads beyond the partition count sit idle.
spring.kafka.listener.concurrency=3
# BATCH (the default) commits the offsets of a whole poll() after the listener has handled every
# record. MANUAL / MANUAL_IMMEDIATE hand an Acknowledgment to the listener instead.
spring.kafka.listener.ack-mode=batch

# --- Lab settings ---------------------------------------------------------------------------
lab.outbox.poll-interval=1s
lab.kafka.retry.interval=1s
lab.kafka.retry.max-retries=2
