spring.application.name=batch-csv-import

# --- Spring Batch ---------------------------------------------------------------------------
# Boot would run the single Job bean at startup with empty parameters. Jobs are launched by the scheduler instead.
spring.batch.job.enabled=false
# The default is "embedded" (H2/HSQL only). Flyway owns the Batch schema (V1__spring_batch_schema.sql) instead.
spring.batch.jdbc.initialize-schema=never

# --- @Async ---------------------------------------------------------------------------------
# AsyncConfig declares its own Executor bean (reportExecutor). In "auto" mode that makes Boot's
# applicationTaskExecutor back off. "force" keeps it, so plain @Async still gets Boot's executor,
# which becomes virtual-thread based when spring.threads.virtual.enabled=true.
spring.task.execution.mode=force
spring.task.execution.thread-name-prefix=app-async-
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=200
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=30s

# --- Virtual threads ------------------------------------------------------------------------
# Flip to true on Java 21+ (24+ recommended): applicationTaskExecutor and the scheduler switch to virtual threads.
spring.threads.virtual.enabled=false

# --- Import scheduling ----------------------------------------------------------------------
importer.inbox=file:./inbox/*.csv
importer.schedule.enabled=true
# Spring cron has SIX fields: second minute hour day-of-month month day-of-week. 02:00 every night.
importer.schedule.cron=0 0 2 * * *
importer.schedule.zone=Europe/London
importer.schedule.inbox-poll=PT1M
