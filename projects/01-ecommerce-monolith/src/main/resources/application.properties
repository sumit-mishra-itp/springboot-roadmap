spring.application.name=ecommerce-monolith

# No datasource URL or password here: set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD in the environment,
# or run `./mvnw spring-boot:test-run` to get a throwaway Testcontainers Postgres.

# Never hold a DB connection for the whole HTTP request. Services map entities to DTOs inside their transaction.
spring.jpa.open-in-view=false
# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate

# Blocking JDBC app: Tomcat request threads become virtual threads. The Hikari pool still caps DB concurrency.
spring.threads.virtual.enabled=true

# Clients can ask for ?size=5000. Spring Data clamps it to this instead (its default cap is 2000).
spring.data.web.pageable.max-page-size=100

# Concurrent multi-product orders lock product rows in UPDATE order. Ordering the UPDATEs by entity id makes every
# transaction lock rows in the same order, so two orders can't deadlock (which would surface as a 500).
spring.jpa.properties.hibernate.order_updates=true

# Self-issued JWTs (see auth/SecurityConfig). The app is its own tiny authorization server, so it picks these names.
app.auth.issuer=https://api.shopsphere.dev
app.auth.audience=shopsphere-api
app.auth.access-token-ttl=15m
app.auth.refresh-token-ttl=7d
# The bootstrap admin. Its password has NO default: set APP_AUTH_ADMIN_PASSWORD in the environment.
app.auth.admin-username=admin
